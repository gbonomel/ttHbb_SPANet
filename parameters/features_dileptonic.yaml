# Defines default values for fields that are missing from collections
features_pad:
  common:
    JetGood:
      mass: 0.0  # Your JetGood collection does not have 'mass'
    JetGoodMatched:
      mass: 0.0  # Your JetGoodMatched collection does not have 'mass'
    LeptonGood:
      mass: 0.0  # Your LeptonGood collection does not have 'mass'
    MET:
      mass: 0.0  # Your MET collection does not have 'mass'
      eta: 0.0   # Your MET collection does not have 'eta'
  by_sample: {}

# Lists all jagged collections (arrays of objects)
awkward_collections:
  - Parton
  - PartonMatched
  - PartonLastCopy
  - PartonLastCopyMatched
  - JetGood
  - JetGoodMatched
  - TopLepton
  - AntiTopLepton
  - TopLeptonMatched
  - AntiTopLeptonMatched
  - ISR
  - LeptonGood
  # Note: LeptonGood, MET, HiggsParton, etc. are NOT collections

# Maps "truth" collections to their "matched" subsets
matched_collections:
  Parton: PartonMatched
  PartonLastCopy: PartonLastCopyMatched
  JetGood: JetGoodMatched
  TopLepton: TopLeptonMatched    
  AntiTopLepton: AntiTopLeptonMatched
