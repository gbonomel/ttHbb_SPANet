      #- MC_DYto2L-4Jets_MLL-120_HT-1500to2500
      #- MC_DYto2L-4Jets_MLL-120_HT-2500

  2024:
    years: [2024]
    tthbb:
      - MC_TTH-Hto2B-TTtoLNu2Q_Par-M-125                 
      - MC_TTH-Hto2B-TTto2L2Nu_Par-M-125
    ttbar:                          # split in subsamples ttB, ttC, ttLF
      - MC_TTtoLNu2Q
      - MC_TTto2L2Nu
      - MC_TTto4Q
      - MC_TTBB-TTtoLNu2Q
      - MC_TTBB-TTto2L2Nu
      - MC_TTBB-TTto4Q
      - MC_TTtoLNu2Q-BBDPS
      - MC_TTto2L2Nu-BBDPS
      - MC_TTto4Q-BBDPS
    others:
      - MC_TTH-HtoNon2B_Par-M-125
      - MC_TbarBQtoLNu-t-channel-4FS
      - MC_TBbarQtoLNu-t-channel-4FS
      - MC_TBbartoLplusNuBbar-s-channel-4FS
      - MC_TbarBtoLminusNuB-s-channel-4FS
      - MC_TbarWplusto2L2Nu
      - MC_TbarWplustoLNu2Q
      - MC_TWminusto2L2Nu
      - MC_TWminustoLNu2Q

      - MC_TTLL_Bin-MLL-4to50
      - MC_TTLL_Bin-MLL-50
      - MC_TTZ-ZtoQQ-1Jets
      - MC_TTNuNu
      - MC_TTW-WtoQQ-1Jets

      #- MC_WtoLNu-4Jets_Bin-HT-40to100-MLNu-0to120
      #- MC_WtoLNu-4Jets_Bin-HT-100to400-MLNu-0to120
      #- MC_WtoLNu-4Jets_Bin-HT-100to400-MLNu-120
      #- MC_WtoLNu-4Jets_Bin-HT-400to800-MLNu-0to120
      #- MC_WtoLNu-4Jets_Bin-HT-400to800-MLNu-120
      #- MC_WtoLNu-4Jets_Bin-HT-800to1500-MLNu-0to120
      #- MC_WtoLNu-4Jets_Bin-HT-800to1500-MLNu-120
      #- MC_WtoLNu-4Jets_Bin-HT-1500to2500-MLNu-0to120
      #- MC_WtoLNu-4Jets_Bin-HT-1500to2500-MLNu-120
      #- MC_DYto2E_Bin-MLL-10to50
      #- MC_DYto2E-2Jets_Bin-MLL-50
      #- MC_DYto2Mu_Bin-MLL-10to50
      #- MC_DYto2Mu-2Jets_Bin-MLL-50
      #- MC_DYto2Tau_Bin-MLL-10to50
      #- MC_DYto2Tau-2Jets_Bin-MLL-50

parquet:
  cfg: parameters/features_run3_genmatched_semilep.yaml

h5:
  cfg: parameters/features_spanet_h5_run3_semileptonic.yaml
  final_state: semileptonic
  # One h5 file per entry and per year ({year} is replaced). Each file takes all the datasets of the groups
  # in `groups` plus the parquet files in `subsamples` (names without year, <dataset>_<subsample>).
  # `args` are passed as extra arguments to parquet_to_h5.py (e.g. --fully_matched, --reweigh).
  files:
    background_{year}:
      groups: [others]
      subsamples:                   # 5FS for ttC and ttLF, 4FS for ttB
        - MC_TTto2L2Nu_ttC
        - MC_TTtoLNu2Q_ttC
        - MC_TTto4Q_ttC
        - MC_TTBB-TTtoLNu2Q_ttB
        - MC_TTBB-TTto2L2Nu_ttB
        - MC_TTBB-TTto4Q_ttB
        - MC_TTtoLNu2Q-BBDPS_ttB
        - MC_TTto2L2Nu-BBDPS_ttB
        - MC_TTto4Q-BBDPS_ttB
        - MC_TTtoLNu2Q_ttLF
        - MC_TTto2L2Nu_ttLF
        - MC_TTto4Q_ttLF
    tthbb_{year}: # contains jet parton matching information, used for assignment training in SPANet
      groups: [tthbb]

# HTCondor jobs of the --condor mode: one job per parquet/h5 output, in the PocketCoffea image (venv with ttHbb_SPANet, see jobs/run_pipeline.sh).
# request_memory is in MB; at CERN each CPU comes with 2 GB, jobs asking for more memory wait longer to start.
condor:
  image: /cvmfs/unpacked.cern.ch/gitlab-registry.cern.ch/cms-analysis/general/pocketcoffea:lxplus-el9-stable
  parquet:
    request_memory: 16000
    request_cpus: 1
    job_flavour: espresso
  h5:
    request_memory: 16000           # h5 files can override it with their own request_memory (tthbb_2024: ~10.5 GB peak)
    request_cpus: 1
    job_flavour: espresso
