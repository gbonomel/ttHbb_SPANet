# Configuration of scripts/run_pipeline.py: PocketCoffea output -> merged parquet -> (optional) SPANet h5.
#
# The datasets listed in `datasets` are shared by the parquet and the h5 steps: comment a dataset out to
# drop it from both. The PocketCoffea sample of each dataset is read from config.json, and the datasets
# split in subsamples (ttB/ttC/ttLF) give one parquet file per subsample, e.g. MC_TTtoLNu2Q_ttB_2022_preEE.

python: python          # interpreter used to run the conversion scripts (must have coffea/awkward)
base_dir: /afs/cern.ch/work/g/gbonomel/higgs/ttHbb_SPANet

# Merged coffea file (PocketCoffea job outputs merged beforehand): it gives the sample of each dataset
merged_coffea: /afs/cern.ch/work/g/gbonomel/higgs/ttHbb/spanet/training_5wp_multiplewp/no_triggerSF/output_ntuples_all.coffea

# Folder with the parquet ntuples saved by PocketCoffea: <ntuples>/<dataset>[/<subsample>]/<category>/<variation>
ntuples: /eos/cms/store/group/phys_higgs/ttHbb/ntuples/ttHbb_export/training_5wps_multiplewp/no_triggerSF/semilep_channel/ntuples

# Outputs: <output>/parquet_overall/<year>/<name>.parquet and <output>/h5_files/<name>.h5
output: /eos/cms/store/group/phys_higgs/ttHbb/ntuples/ttHbb_export/training_5wps_multiplewp/no_triggerSF/semilep_channel

category: baseline_5j3b
variation: nominal

# Datasets (names without year) per group of years. The group names (tthbb, ttbar, others, ...) are free
# and are used in `h5.files` to choose which datasets go into each h5 file.
datasets:
  2022_23:
    years: [2022_preEE, 2022_postEE, 2023_preBPix, 2023_postBPix]
    tthbb:
      - MC_TTH_Hto2B_M-125
    ttbar:                          # split in subsamples ttB, ttC, ttLF
      - MC_TTtoLNu2Q
      - MC_TTto2L2Nu
      - MC_TTto4Q
      - MC_TTBB-TTtoLNu2Q
      - MC_TTBB-TTto2L2Nu
      - MC_TTBB-TTto4Q
      - MC_TTtoLNu2Q-BBDPS
      - MC_TTto2L2Nu-BBDPS
      - MC_TTto4Q-BBDPS
    others:
      - MC_TTHtoNon2B_M-125

      - MC_TbarBQtoLNu-t-channel-4FS
      - MC_TBbarQtoLNu-t-channel-4FS
      - MC_TBbartoLplusNuBbar-s-channel-4FS
      - MC_TbarBtoLminusNuB-s-channel-4FS
      - MC_TbarWplusto2L2Nu
      - MC_TbarWplustoLNu2Q
      - MC_TWminusto2L2Nu
      - MC_TWminustoLNu2Q

      - MC_TTZ-ZtoQQ-TTtoLNu2Q-1Jets
      - MC_TTZ-ZtoQQ-TTto2L2Nu-1Jets
      - MC_TTLL_MLL-4to50
      - MC_TTLL_MLL-50
      - MC_TTNuNu
      - MC_TTLNu-1Jets
      - MC_TTW-WtoQQ-1Jets

      #- MC_WtoLNu-4Jets_MLNu-0to120_HT-40to100
      #- MC_WtoLNu-4Jets_MLNu-0to120_HT-100to400
      #- MC_WtoLNu-4Jets_MLNu-0to120_HT-400to800
      #- MC_WtoLNu-4Jets_MLNu-0to120_HT-800to1500
      #- MC_WtoLNu-4Jets_MLNu-0to120_HT-1500to2500
      #- MC_WtoLNu-4Jets_MLNu-120_HT-40to100
      #- MC_WtoLNu-4Jets_MLNu-120_HT-100to400
      #- MC_WtoLNu-4Jets_MLNu-120_HT-400to800
      #- MC_WtoLNu-4Jets_MLNu-120_HT-800to1500
      #- MC_WtoLNu-4Jets_MLNu-120_HT-1500to2500
      #- MC_DYto2L-4Jets_MLL-4to50_HT-40to70
      #- MC_DYto2L-4Jets_MLL-4to50_HT-70to100
      #- MC_DYto2L-4Jets_MLL-4to50_HT-100to400
      #- MC_DYto2L-4Jets_MLL-4to50_HT-400to800
      #- MC_DYto2L-4Jets_MLL-4to50_HT-800to1500
      #- MC_DYto2L-4Jets_MLL-4to50_HT-1500to2500
      #- MC_DYto2L-4Jets_MLL-4to50_HT-2500
      #- MC_DYto2L-4Jets_MLL-50to120_HT-40to70
      #- MC_DYto2L-4Jets_MLL-50to120_HT-70to100
      #- MC_DYto2L-4Jets_MLL-50to120_HT-100to400
      #- MC_DYto2L-4Jets_MLL-50to120_HT-400to800
      #- MC_DYto2L-4Jets_MLL-50to120_HT-800to1500
      #- MC_DYto2L-4Jets_MLL-50to120_HT-1500to2500
      #- MC_DYto2L-4Jets_MLL-50to120_HT-2500
      #- MC_DYto2L-4Jets_MLL-120_HT-40to70
      #- MC_DYto2L-4Jets_MLL-120_HT-70to100
      #- MC_DYto2L-4Jets_MLL-120_HT-100to400
