input:
  Jet: [MASK, pt, eta, phi, sin_phi, cos_phi, btag, btag_L, btag_M, btag_H, btag_CvL, btag_CvB]
  Lepton: [pt, eta, phi, sin_phi, cos_phi, is_electron]
  Met: [pt, eta, phi, sin_phi, cos_phi]
  Event: [ht]

collection:
  Jet: JetGood
  Lepton: LeptonGood
  Met: MET

particles: [t1, t2, h]

mapping_sample:
  TTH_HTo2B: tthbb
  ttB: ttbb
  ttC: ttcc
  ttLF: ttlf

mapping_encoding:
  signal:
    TTH_HTo2B: 1
    ttB: 2
    ttC: 3
    ttLF: 4

classification:
  EVENT:
    - tthbb
    - ttbb
    - ttcc
    - ttlf
    - signal

frac_train: 0.8
